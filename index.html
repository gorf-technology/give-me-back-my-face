<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#E4E4E1">
<meta name="description" content="친구 얼굴을 조각내고 섞는 슬라이딩 퍼즐.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="내 얼굴 돌려줘">
<link rel="manifest" href="manifest.json">
<title>내 얼굴 돌려줘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  /* 사진관 배경지 톤: 피부색이 가장 정직하게 보이는 중성 회색 */
  --bg-center:#E6E6E3;
  --bg-edge:#B7B7B2;
  --paper:#FFFFFF;
  --ink:#141414;
  --muted:#6B6B66;
  --line:#D2D2CD;
  --stamp:#C4311F;
  --tray:#2B2B2B;
  /* 보드 폭. 세로 보드라 화면 높이가 먼저 모자란다 → 높이 기준 상한도 건다.
     340px = 헤더·문구·버튼·푸터가 차지하는 대략의 세로 공간 */
  --ratio:calc(3 / 4);
  --board:max(200px, min(86vw, 360px, calc((100dvh - 340px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * var(--ratio))));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse 90% 70% at 50% 38%, var(--bg-center) 0%, #D4D4D0 55%, var(--bg-edge) 100%);
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

header{
  width:100%;max-width:520px;
  padding:calc(env(safe-area-inset-top) + 16px) 20px 0;
  display:flex;justify-content:space-between;align-items:baseline;
}
h1{font-size:15px;margin:0;font-weight:800;letter-spacing:-.02em}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--muted)}

main{
  flex:1;width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 20px;gap:18px;
}
.screen{display:none;flex-direction:column;align-items:center;gap:16px;width:100%}
.screen.on{display:flex}

.status{text-align:center;min-height:50px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.status .line{font-size:19px;font-weight:700;letter-spacing:-.02em}
.status .sub{font-size:12.5px;color:var(--muted);line-height:1.5}
.status .sub{white-space:pre-line;word-break:keep-all}  /* 문장마다 \n으로 줄을 나누고, 단어 중간에서 끊지 않는다 */

.btn{
  padding:14px 20px;border-radius:2px;background:var(--ink);color:#F5F5F3;
  font-size:15px;font-weight:600;letter-spacing:-.01em;width:100%;
  transition:transform .08s ease;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;transform:none}
.note.ok{color:var(--ink);font-weight:600}
.note.err{color:var(--stamp)}
.btn.ghost{background:rgba(255,255,255,.35);color:var(--ink);border:1px solid #8E8E88}
.btn.stamp{background:var(--stamp);color:#fff}
.btn:focus-visible,.tool:focus-visible,.util:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;width:100%}
.stack{display:flex;flex-direction:column;gap:9px;width:100%;max-width:var(--board)}

/* 시작: 뷰파인더 */
.slate{
  width:var(--board);aspect-ratio:var(--ratio);background:var(--paper);position:relative;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 44px -26px rgba(0,0,0,.5);
}
.slate i{position:absolute;width:26px;height:26px;border-color:var(--ink);border-style:solid;border-width:0}
.slate i:nth-child(1){top:16px;left:16px;border-top-width:2px;border-left-width:2px}
.slate i:nth-child(2){top:16px;right:16px;border-top-width:2px;border-right-width:2px}
.slate i:nth-child(3){bottom:16px;left:16px;border-bottom-width:2px;border-left-width:2px}
.slate i:nth-child(4){bottom:16px;right:16px;border-bottom-width:2px;border-right-width:2px}
.slate .cap{font-size:14px;font-weight:600;letter-spacing:-.01em;text-align:center;padding:0 30px}

/* 크롭 */
#cropFrame{
  width:var(--board);aspect-ratio:var(--ratio);position:relative;overflow:hidden;
  background:var(--tray);touch-action:none;
  box-shadow:0 20px 44px -26px rgba(0,0,0,.5);
}
#cropImg{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.cropGuide{position:absolute;inset:0;pointer-events:none}
.tools{display:flex;gap:8px;width:100%;max-width:var(--board)}
.tool{
  flex:1;padding:10px 0;border:1px solid #8E8E88;border-radius:2px;
  font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.35);
}
.tool:active{background:#fff}
.tool[aria-pressed="true"]{background:var(--ink);color:#F5F5F3;border-color:var(--ink)}

/* 보드 */
#boardWrap{position:relative;width:var(--board);aspect-ratio:var(--ratio)}
#board{position:absolute;inset:0;background:var(--tray);box-shadow:0 20px 44px -26px rgba(0,0,0,.55);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}  /* 드래그 중 스크롤·당겨서 새로고침·확대경 차단 */
.piece{
  position:absolute;top:0;left:0;background-repeat:no-repeat;
  transition:transform .22s cubic-bezier(.25,1,.35,1),
             opacity .35s ease,
             width .3s ease,height .3s ease,
             background-size .3s ease,background-position .3s ease;
  will-change:transform;
}
.piece.gone{opacity:0;pointer-events:none}
.piece.picked{box-shadow:inset 0 0 0 3px var(--stamp)}
#scBoard.picking .piece{cursor:pointer}
.piece.flying{transition-duration:.42s}
.piece.locked{transition-duration:.6s}
@media (prefers-reduced-motion:reduce){.piece{transition-duration:.01ms !important}}

#stampMark{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-11deg) scale(2.4);
  opacity:0;pointer-events:none;z-index:20;
  color:var(--stamp);border:3px double var(--stamp);
  padding:9px 18px;font-size:21px;font-weight:800;letter-spacing:.05em;
  background:rgba(255,255,255,.88);
  transition:transform .22s cubic-bezier(.2,1.4,.4,1),opacity .16s ease;
}
#stampMark.on{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:1}

footer{
  width:100%;max-width:520px;
  padding:0 20px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;justify-content:space-between;align-items:center;
}
.util{font-size:11.5px;color:var(--muted);padding:8px 4px}

.modal{position:fixed;inset:0;background:rgba(20,20,20,.5);display:none;align-items:center;justify-content:center;padding:22px;z-index:60}
.modal.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:400px;padding:22px;display:flex;flex-direction:column;gap:13px}
.sheet h2{margin:0;font-size:17px;letter-spacing:-.02em}
.sheet p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:2px;font:inherit;font-size:14px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.note{font-size:11.5px;color:var(--muted);min-height:16px}
input[type=file]{display:none}

/* 가로모드 차단 */
#rotateGate{
  position:fixed;inset:0;z-index:100;display:none;background:var(--bg-center);
  flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;
}
#rotateGate .big{font-size:21px;font-weight:800;letter-spacing:-.02em}
#rotateGate .small{font-size:13px;color:var(--muted)}
@media (orientation:landscape) and (max-height:520px){#rotateGate{display:flex}}
</style>
</head>
<body>

<header>
  <h1>내 얼굴 돌려줘</h1>
  <span class="eyebrow mono" id="docNo">no. ------</span>
</header>

<main>
  <!-- 시작 -->
  <section class="screen on" id="scIntro">
    <div class="slate">
      <i></i><i></i><i></i><i></i>
      <div class="cap">소중한 친구의 사진을 올려주세요.</div>
    </div>
    <div class="stack">
      <button class="btn" id="btnCamera">사진 찍기</button>
      <button class="btn ghost" id="btnAlbum">앨범에서 고르기</button>
    </div>
    <div class="status"><div class="sub">사진은 링크를 만들 때만 올라가고, 게임이 끝나면 지워집니다.</div></div>
    <input type="file" id="fileCamera" accept="image/*" capture="user">
    <input type="file" id="fileAlbum" accept="image/*">
  </section>

  <!-- 크롭 -->
  <section class="screen" id="scCrop">
    <div class="status">
      <div class="line">얼굴이 잘 보이게 맞춰주세요.</div>
      <div class="sub">끌어서 옮기고, 두 손가락으로 확대합니다.</div>
    </div>
    <div id="cropFrame">
      <img id="cropImg" alt="">
      <div class="cropGuide"></div>
    </div>
    <div class="tools">
      <button class="tool" id="btnRotL">↺ 회전</button>
      <button class="tool" id="btnFlip" aria-pressed="false">좌우 반전</button>
      <button class="tool" id="btnRotR">회전 ↻</button>
    </div>
    <div class="stack">
      <button class="btn" id="btnCropDone">이 얼굴로 하기</button>
      <button class="btn ghost" id="btnCropBack">다른 사진 고르기</button>
    </div>
  </section>

  <!-- 보드: 해체 · 퍼즐 · 결과 공용 -->
  <section class="screen" id="scBoard">
    <div class="status">
      <div class="line" id="boardLine">감사합니다.</div>
      <div class="sub" id="boardSub"></div>
    </div>
    <div id="boardWrap">
      <div id="board"></div>
      <div id="stampMark">본인 확인 완료</div>
    </div>
    <div class="stack" id="boardActions"></div>
  </section>
</main>

<footer>
  <button class="util" id="btnContact">개발자에게 문의</button>
  <button class="util" id="btnRestart" style="visibility:hidden">처음으로</button>
</footer>

<div class="modal" id="modalContact">
  <div class="sheet">
    <h2>개발자에게 문의</h2>
    <p>사진은 전송되지 않습니다. 적어주신 내용만 전달됩니다.</p>
    <textarea id="contactText" placeholder="불편한 점이나 제안을 적어주세요."></textarea>
    <div class="note" id="contactNote"></div>
    <div class="row">
      <button class="btn ghost" id="btnContactClose">닫기</button>
      <button class="btn" id="btnContactSend">보내기</button>
    </div>
  </div>
</div>

<div class="modal" id="modalArrive">
  <div class="sheet">
    <h2>누군가 당신의 얼굴을 흩어놨습니다</h2>
    <p>조각을 옮겨 얼굴을 되찾으세요.</p>
    <button class="btn stamp" id="btnArriveStart">복구 시작</button>
  </div>
</div>

<div id="rotateGate">
  <div class="big">얼굴이 누웠습니다.</div>
  <div class="small">화면을 세로로 돌려주세요.</div>
</div>

<script>
/* =========================================================
   내 얼굴 돌려줘 v2.1.0
   v2.1.0: 조각을 끌어서 옮기기(탭도 유지). 해체 장면을 GIF로 저장(자체 인코더, 외부 라이브러리 없음)
   v2.0.2: 안내 문구 정리(시작·퍼즐·링크 화면, 받는 쪽 완성 문구와 버튼). 동작 변경 없음
   v2.0.1: 링크 화면에 [카톡으로 보내기](공유 시트) 추가. 링크를 #(해시)와 ?(쿼리) 어느 쪽으로 받아도 연다
   v2.0.0: 링크 공유. 보내는 쪽이 섞은 배치 그대로 친구가 맞춘다.
           사진은 Supabase Storage(공개 버킷 faces)에 올라가고, 받는 쪽 게임이 끝나면 삭제.
           공개 버킷이어도 목록 조회·덮어쓰기·엉뚱한 이름 업로드는 RLS가 막는다. 방어선은 128 bit 난수 파일 이름
           1시간 지난 링크는 앱이 만료 처리(열리는 순간 남은 파일도 삭제 시도).
   v1.5.0: 섞기를 '최단 18~22수 + 멀리 간 조각 3개 이상' 구간 재추출로 교체
   ========================================================= */

/* ---------- 설정값 ---------- */
const APP_NAME       = '내 얼굴 돌려줘';
const APP_VERSION    = 'v2.1.0';
const COLS           = 3;        // 가로 칸 수, 단위: 칸
const ROWS           = 4;        // 세로 칸 수, 단위: 칸 (v1.3.0: 3×3 → 3×4 세로형)
const CELLS          = COLS * ROWS;
const BLANK_DEFAULT  = COLS - 1; // 빠지는 조각 기본값(우측 상단). 실제 값은 사용자가 고른 S.blank
const SOLVE_MIN      = 18;       // 섞인 배치의 최단 풀이 하한, 단위: 수(한 칸 이동)
const SOLVE_MAX      = 22;       // 섞인 배치의 최단 풀이 상한, 단위: 수. 3×3 완전 섞기 중앙값이 22수
const MIN_MISPLACED  = 8;        // 제자리를 벗어난 조각 하한, 단위: 개 (빈칸 조각 제외 11개 중)
const MIN_FAR        = 3;        // 제자리에서 FAR_CELLS칸 이상 떨어진 조각 하한, 단위: 개. 얼굴이 '미끄러진' 게 아니라 '엉뚱하게' 보이게
const FAR_CELLS      = 2;        // '멀리 간 조각'의 기준 거리, 단위: 칸(Manhattan)
const SHUFFLE_TRIES  = 400;      // 재추출 상한, 단위: 회. 넘으면 조건에 가장 가까운 후보를 쓴다
const CELL_PX        = 240;      // 결과 이미지의 조각 한 변, 단위: px
const CROP_W_PX      = CELL_PX * COLS;   // 720 px
const CROP_H_PX      = CELL_PX * ROWS;   // 960 px (조각은 정사각, 전체는 3:4)
const SHARE_PAD_PX   = 130;      // 공유 이미지 하단 라벨 높이, 단위: px
const GAP_PX         = 2;        // 조각 간격, 단위: px
const PICK_HOLD_MS   = 450;      // 조각을 고른 뒤 사라지기까지, 단위: ms
const VANISH_MS      = 450;      // 한 조각 사라짐, 단위: ms
const SCATTER_MS     = 800;      // 흩어짐, 단위: ms
const SETTLE_MS      = 480;      // 착지 대기, 단위: ms
const MAX_ZOOM       = 6;        // 크롭 최대 확대 배율
const CONTACT_CAP    = 5;        // 기기당 하루 문의 상한, 단위: 건
const CONTACT_DONE_MS = 1800;    // '보냈습니다' 표시 후 창이 닫히기까지, 단위: ms
const CAMERA_MIRROR  = true;     // 카메라로 찍은 사진을 촬영 화면(거울상)과 같게 보여줌
const LINK_TTL_MS    = 60 * 60 * 1000;   // 링크 수명, 단위: ms (60 min × 60 s × 1000 ms = 3,600,000 ms)
const UPLOAD_MAX_B   = 200 * 1024;       // 업로드 상한, 단위: B (200 KB × 1024 B/KB = 204,800 B). 버킷 설정과 같아야 한다
const UPLOAD_QUALITY = [0.75, 0.65, 0.55, 0.45, 0.35]; // JPEG 품질 후보. 상한을 넘으면 다음 값으로 재인코딩
const COPY_DONE_MS   = 1600;     // '복사했습니다' 표시 시간, 단위: ms
const SHARE_TEXT     = '네 얼굴 내가 가져갔다';  // 공유 시트로 링크와 같이 보내는 한 줄. 링크를 깨면 '' 로 비운다
const DRAG_COMMIT    = 0.35;     // 손을 놓았을 때 이동을 확정하는 거리, 단위: 한 칸 대비 비율
const DRAG_FLICK     = 0.4;      // 이보다 빠르게 튕기면 거리가 짧아도 확정, 단위: px/ms
const DRAG_TAP_PX    = 6;        // 이 이하로 움직이고 떼면 탭으로 본다, 단위: px
const GIF_W_PX       = 360;      // GIF 가로, 단위: px
const GIF_H_PX       = 540;      // GIF 세로, 단위: px (보드 358 px + 위 40 px + 하단 글씨 영역)
const GIF_CELL_PX    = 88;       // GIF 안 조각 한 변, 단위: px. 보드 = 88×3 + 2×2 = 268 px 폭
const GIF_TOP_PX     = 40;       // 보드 위 여백, 단위: px
const GIF_FRAME_MS   = 60;       // 움직이는 구간의 프레임 간격, 단위: ms (약 16.7 fps)
const GIF_MOVE_FRAMES = 7;       // 튀기·착지 구간 각각의 프레임 수, 단위: 장 (7 × 60 ms = 420 ms = CSS 전환 시간)
const GIF_HOLD_START_MS = 700;   // 처음 온전한 얼굴을 보여주는 시간, 단위: ms
const GIF_HOLD_END_MS = 2600;    // 마지막 흩어진 얼굴을 보여주는 시간, 단위: ms
const GIF_ADDRESS    = 'gorf-technology.github.io/give-me-back-my-face';  // GIF 마지막 장면에 적는 게임 주소
const LINK_IN        = 'hash';   // 링크 정보를 담는 위치: 'hash'(#, 서버·미리보기 봇이 못 봄) | 'query'(?, 카톡이 #을 끊을 때의 대비책)

// Supabase — 공개해도 되는 값만 둔다(publishable key). Secret key는 절대 넣지 않는다
const SUPABASE = {
  url:'https://buuoophntnmtsoswzysm.supabase.co',
  key:'sb_publishable_TgQ_ImnrP4L2e0aWQuk1uw_rKJ-2c--',
  bucket:'faces'
};

// EmailJS — 배포 전에 채운다. 비어 있으면 문의 전송이 꺼진다.
// 공용 문의 템플릿(gorf-technology 앱 공통). 공개돼도 되는 값만 둔다. Private Key는 절대 넣지 않는다
const EMAILJS = { publicKey:'Qck7jS8TjdYKD11mf', serviceId:'service_7t9mj84', templateId:'template_b93zwli' };

/* ---------- 상태 ---------- */
const S = {
  scene:'intro', srcBmp:null, viewCv:null, cropCv:null,
  rot:0, flip:false,
  order:[],      // order[slot] = pieceIndex
  pieces:[], gap:GAP_PX, solved:false, busy:false,
  blank:BLANK_DEFAULT,   // 빠진 조각 번호 (2차 링크의 b= 값이 된다)
  nextOrder:null,        // 조각을 고르는 동안 미리 계산해 둔 섞인 배치
  role:'sender',         // 'sender' = 직접 사진을 올린 사람, 'receiver' = 링크로 들어온 친구
  token:null,            // 링크 토큰 (= 저장소 파일 이름의 몸통)
  linkBusy:false,        // 링크 만드는 중 연타 방지
  scatterFx:null,        // 해체 때 조각마다 튄 방향·회전(GIF가 같은 장면을 다시 그린다)
  shatterOrder:null,     // 해체 직후 배치(직접 맞추기를 해도 GIF는 이 배치로 끝난다)
  gifJob:null,           // GIF 만들기 Promise<Blob|null>
  suppressClick:false,   // 드래그로 옮긴 직후 따라오는 click을 한 번 무시
  crop:{ scale:1, base:1, tx:0, ty:0 }
};

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const board = $('board'), boardWrap = $('boardWrap');
const cropFrame = $('cropFrame'), cropImg = $('cropImg');
let frameW = 0, frameH = 0;
document.documentElement.style.setProperty('--ratio', `calc(${COLS} / ${ROWS})`);

/* 크롭 가이드선을 COLS·ROWS에 맞춰 그린다 (칸 수를 바꿔도 CSS를 고칠 필요 없음) */
(function drawCropGuide(){
  const c = 'rgba(255,255,255,.14)', layers = [];
  const line = (dir, at) => layers.push(
    `linear-gradient(to ${dir},transparent ${at},${c} ${at},${c} calc(${at} + 1px),transparent calc(${at} + 1px))`);
  for(let k = 1; k < COLS; k++) line('right',  (100 * k / COLS).toFixed(4) + '%');
  for(let k = 1; k < ROWS; k++) line('bottom', (100 * k / ROWS).toFixed(4) + '%');
  document.querySelector('.cropGuide').style.background = layers.join(',');
})();

/* ---------- 화면 전환 ---------- */
function show(name){
  S.scene = name;
  const map = { intro:'scIntro', crop:'scCrop', pick:'scBoard', shatter:'scBoard', play:'scBoard', done:'scBoard',
                link:'scBoard', load:'scBoard', expired:'scBoard' };
  $('scBoard').classList.toggle('picking', name === 'pick');
  ['scIntro','scCrop','scBoard'].forEach(id => $(id).classList.toggle('on', map[name] === id));
  $('btnRestart').style.visibility = (name === 'intro') ? 'hidden' : 'visible';
}
function setLine(line, sub){ $('boardLine').textContent = line; $('boardSub').textContent = sub || ''; }
function setActions(list){
  const wrap = $('boardActions'); wrap.innerHTML = '';
  list.forEach(([label, cls, fn]) => {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = fn;
    wrap.appendChild(b);
  });
}

/* ---------- 사진 읽기 ---------- */
async function loadFile(file, fromCamera = false){
  if(!file) return;
  let bmp;
  try{ bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){ bmp = await createImageBitmap(file); }
  // iPhone 셀카: 촬영 화면은 거울상인데 저장본은 뒤집히지 않아 '반전돼 보임'.
  // 카메라 경로만 기본 반전해서 찍을 때 본 모습 그대로 보여준다. 앨범은 원본 그대로.
  S.srcBmp = bmp; S.rot = 0; S.flip = fromCamera && CAMERA_MIRROR;
  $('btnFlip').setAttribute('aria-pressed', String(S.flip));
  // 화면을 먼저 켜야 프레임 크기를 잴 수 있다 (v1.0.0 버그: 순서가 반대였다)
  show('crop');
  rebuildView();
  $('docNo').textContent = 'no. ' + Math.random().toString(36).slice(2,8).toUpperCase();
}

/* 회전·반전을 반영한 표시용 canvas */
function rebuildView(){
  frameW = cropFrame.clientWidth; frameH = cropFrame.clientHeight;
  if(!frameW || !frameH){ requestAnimationFrame(rebuildView); return; }

  const b = S.srcBmp, r = S.rot, swap = (r === 90 || r === 270);
  const cv = document.createElement('canvas');
  cv.width  = swap ? b.height : b.width;
  cv.height = swap ? b.width  : b.height;
  const ctx = cv.getContext('2d');
  ctx.translate(cv.width / 2, cv.height / 2);
  if(S.flip) ctx.scale(-1, 1);          // 회전된 화면 기준 좌우 반전
  ctx.rotate(r * Math.PI / 180);
  ctx.drawImage(b, -b.width / 2, -b.height / 2);
  S.viewCv = cv;

  cropImg.src = cv.toDataURL('image/jpeg', .92);
  cropImg.style.width = cv.width + 'px';
  cropImg.style.height = cv.height + 'px';

  const base = Math.max(frameW / cv.width, frameH / cv.height);
  S.crop.base = base; S.crop.scale = base;
  S.crop.tx = (frameW - cv.width * base) / 2;
  S.crop.ty = (frameH - cv.height * base) / 2;
  applyCrop();
}

/* ---------- 크롭 조작 ---------- */
function clampCrop(){
  const w = S.viewCv.width * S.crop.scale, h = S.viewCv.height * S.crop.scale;
  S.crop.tx = Math.min(0, Math.max(frameW - w, S.crop.tx));
  S.crop.ty = Math.min(0, Math.max(frameH - h, S.crop.ty));
}
function applyCrop(){
  clampCrop();
  cropImg.style.transform = `translate(${S.crop.tx}px, ${S.crop.ty}px) scale(${S.crop.scale})`;
}

const ptrs = new Map();
let pinch0 = null;
function snapshotPinch(){
  const [a,b] = [...ptrs.values()];
  const r = cropFrame.getBoundingClientRect();
  return { dist:Math.hypot(a.x-b.x, a.y-b.y),
           cx:(a.x+b.x)/2 - r.left, cy:(a.y+b.y)/2 - r.top,
           scale:S.crop.scale, tx:S.crop.tx, ty:S.crop.ty };
}
function zoomAt(target, cx, cy, from){
  const k = target / from.scale;
  S.crop.tx = cx - (cx - from.tx) * k;
  S.crop.ty = cy - (cy - from.ty) * k;
  S.crop.scale = target; applyCrop();
}
cropFrame.addEventListener('pointerdown', e => {
  cropFrame.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(ptrs.size === 2) pinch0 = snapshotPinch();
});
cropFrame.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId) || !S.viewCv) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(ptrs.size === 1){
    S.crop.tx += e.clientX - prev.x; S.crop.ty += e.clientY - prev.y; applyCrop();
  }else if(ptrs.size === 2 && pinch0){
    const now = snapshotPinch();
    const target = Math.min(S.crop.base * MAX_ZOOM,
                   Math.max(S.crop.base, pinch0.scale * (now.dist / pinch0.dist)));
    zoomAt(target, now.cx, now.cy, pinch0);
  }
});
['pointerup','pointercancel','pointerleave'].forEach(t =>
  cropFrame.addEventListener(t, e => { ptrs.delete(e.pointerId); pinch0 = null; }));
cropFrame.addEventListener('wheel', e => {
  e.preventDefault();
  if(!S.viewCv) return;
  const r = cropFrame.getBoundingClientRect();
  const target = Math.min(S.crop.base * MAX_ZOOM,
                 Math.max(S.crop.base, S.crop.scale * (e.deltaY < 0 ? 1.1 : .9)));
  zoomAt(target, e.clientX - r.left, e.clientY - r.top,
         { scale:S.crop.scale, tx:S.crop.tx, ty:S.crop.ty });
}, { passive:false });

/* 원본 비율은 건드리지 않는다. 자르기만 하고 늘이지 않는다. */
function bakeCrop(){
  const s = S.crop.scale;
  const cv = document.createElement('canvas');
  cv.width = CROP_W_PX; cv.height = CROP_H_PX;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(S.viewCv, -S.crop.tx / s, -S.crop.ty / s, frameW / s, frameH / s,
                0, 0, CROP_W_PX, CROP_H_PX);
  S.cropCv = cv;
}

/* ---------- 슬라이딩 퍼즐 ---------- */
const cellPx = () => (boardWrap.clientWidth - S.gap * (COLS - 1)) / COLS;
const isSolved = () => S.order.every((p, s) => p === s);
const misplaced = order => order.filter((p, s) => p !== s && p !== S.blank).length;

function neighbors(b){
  const r = Math.floor(b / COLS), c = b % COLS, out = [];
  if(r > 0) out.push(b - COLS);
  if(r < ROWS - 1) out.push(b + COLS);
  if(c > 0) out.push(b - 1);
  if(c < COLS - 1) out.push(b + 1);
  return out;
}

function buildPieces(){
  board.innerHTML = ''; S.pieces = [];
  const url = S.cropCv.toDataURL('image/jpeg', .9);
  for(let i = 0; i < CELLS; i++){
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.backgroundImage = `url(${url})`;
    el.onclick = () => { if(S.suppressClick){ S.suppressClick = false; return; } onPieceTap(i); };
    el.addEventListener('pointerdown', e => onPieceDown(i, e));
    board.appendChild(el); S.pieces.push(el);
  }
  S.order = S.pieces.map((_, i) => i);
  layout(false);
}

function layout(animate = true){
  const cell = cellPx(), step = cell + S.gap;
  if(!animate) S.pieces.forEach(el => el.style.transition = 'none');
  S.order.forEach((piece, slot) => {
    const el = S.pieces[piece];
    el.style.width = el.style.height = cell + 'px';
    el.style.backgroundSize = `${cell * COLS}px ${cell * ROWS}px`;
    el.style.backgroundPosition = `${-(piece % COLS) * cell}px ${-Math.floor(piece / COLS) * cell}px`;
    el.style.transform = `translate(${(slot % COLS) * step}px, ${Math.floor(slot / COLS) * step}px)`;
  });
  if(!animate) requestAnimationFrame(() => S.pieces.forEach(el => el.style.transition = ''));
}

/* 제자리까지의 Manhattan 거리 합 (빈칸 조각 제외)
   Args: order — order[slot] = piece
   Returns: 거리 합  Units: 칸 */
function manhattan(order){
  let d = 0;
  order.forEach((p, s) => {
    if(p === S.blank) return;
    d += Math.abs(Math.floor(p / COLS) - Math.floor(s / COLS)) + Math.abs(p % COLS - s % COLS);
  });
  return d;
}

/* 제자리에서 FAR_CELLS칸 이상 떨어진 조각 수
   Args: order  Returns: 개수  Units: 개 */
function farCount(order){
  return order.filter((p, s) => p !== S.blank &&
    Math.abs(Math.floor(p / COLS) - Math.floor(s / COLS)) + Math.abs(p % COLS - s % COLS) >= FAR_CELLS).length;
}

/* IDA* 하한 추정치: Manhattan + linear conflict.
   linear conflict는 줄마다 (제자리 줄에 있는 조각 수 − LIS) × 2 — 쌍마다 2를 더하면 과대추정이라 쓰지 않는다
   Args: order  Returns: 최단 풀이 하한  Units: 수 */
function heuristic(order){
  const lis = a => { const t = []; for(const x of a){ let i = 0; while(i < t.length && t[i] < x) i++; t[i] = x; } return t.length; };
  let h = manhattan(order);
  for(let r = 0; r < ROWS; r++){
    const a = [];
    for(let c = 0; c < COLS; c++){ const p = order[r * COLS + c]; if(p !== S.blank && Math.floor(p / COLS) === r) a.push(p % COLS); }
    h += 2 * (a.length - lis(a));
  }
  for(let c = 0; c < COLS; c++){
    const a = [];
    for(let r = 0; r < ROWS; r++){ const p = order[r * COLS + c]; if(p !== S.blank && p % COLS === c) a.push(Math.floor(p / COLS)); }
    h += 2 * (a.length - lis(a));
  }
  return h;
}

/* 최단 풀이 수 (IDA*). maxDepth를 넘으면 Infinity를 돌려 일찍 끊는다
   Args: order, maxDepth  Returns: 최단 풀이 수 또는 Infinity  Units: 수 */
function solveDepth(order, maxDepth){
  const o = [...order];
  let b = o.indexOf(S.blank), bound = heuristic(o);
  const dfs = (g, prev) => {
    const h = heuristic(o), f = g + h;
    if(f > bound) return f;
    if(h === 0) return -1;
    let min = Infinity;
    for(const t of neighbors(b)){
      if(t === prev) continue;
      const ob = b;
      [o[b], o[t]] = [o[t], o[b]]; b = t;
      const r = dfs(g + 1, ob);
      b = ob; [o[b], o[t]] = [o[t], o[b]];
      if(r === -1) return -1;
      if(r < min) min = r;
    }
    return min;
  };
  while(bound <= maxDepth){
    const r = dfs(0, -1);
    if(r === -1) return bound;
    bound = r;
  }
  return Infinity;
}

/* 완성 상태에서 빈칸을 steps번 무작위로 굴린다(직전 칸 복귀 금지).
   실제 이동만 밟으므로 언제나 풀 수 있다
   Args: steps  Returns: order  Units: steps는 수 */
function randomWalk(steps){
  const order = [...Array(CELLS).keys()];
  let b = S.blank, prev = -1;
  for(let m = 0; m < steps; m++){
    const opts = neighbors(b).filter(x => x !== prev);
    const t = opts[Math.floor(Math.random() * opts.length)];
    [order[b], order[t]] = [order[t], order[b]];
    prev = b; b = t;
  }
  return order;
}

/* v1.5.0: 목표 난이도 구간을 만족할 때까지 다시 뽑는다.
   조건: 최단 풀이 SOLVE_MIN~SOLVE_MAX, 이탈 MIN_MISPLACED 이상, 멀리 간 조각 MIN_FAR 이상.
   2단계 링크에는 이 순열이 그대로 실리므로, 받는 쪽은 계산 없이 같은 난이도를 받는다
   Returns: order  */
function makeShuffle(){
  let best = null, bestGap = Infinity;
  for(let k = 0; k < SHUFFLE_TRIES; k++){
    const steps = SOLVE_MAX + Math.floor(Math.random() * (SOLVE_MAX + 1));
    const order = randomWalk(steps);
    if(misplaced(order) < MIN_MISPLACED || farCount(order) < MIN_FAR) continue;
    const d = solveDepth(order, SOLVE_MAX);
    if(d >= SOLVE_MIN && d <= SOLVE_MAX) return order;
    // 대비책: 시각 조건은 통과했고 구간에 가장 가까운 후보를 남겨 둔다
    const gap = d === Infinity ? SOLVE_MAX : SOLVE_MIN - d;
    if(gap < bestGap){ bestGap = gap; best = order; }
  }
  return best || randomWalk(SOLVE_MAX * 4);
}

function shuffleOrder(){
  S.order = makeShuffle();
}

/* 크롭 직후: 완성된 얼굴을 보여주고 가져갈 조각 하나를 고르게 한다 */
function runPick(){
  show('pick');
  S.solved = false; S.gap = GAP_PX; S.busy = false;
  buildPieces();
  setLine('가져갈 조각을 고르세요.', '고른 조각은 얼굴을 되찾을 때까지 보관합니다.');
  setActions([
    ['아무거나 가져가기', 'ghost', () => pickPiece(Math.floor(Math.random() * CELLS))],
    ['사진 다시 맞추기', 'ghost', () => show('crop')]
  ]);
}

async function pickPiece(i){
  if(S.scene !== 'pick' || S.busy) return;
  S.blank = i; S.busy = true;
  S.pieces[i].classList.add('picked');
  if(navigator.vibrate) navigator.vibrate(15);
  setLine('감사합니다.', ''); setActions([]);
  // 빨간 테두리가 그려진 뒤 섞기를 계산해 대기 시간 안에 숨긴다
  await wait(30);
  const t0 = performance.now();
  S.nextOrder = makeShuffle();
  await wait(Math.max(0, PICK_HOLD_MS - 30 - (performance.now() - t0)));
  S.pieces[i].classList.remove('picked');
  runShatter();
}

async function runShatter(){
  show('shatter');
  S.busy = true;

  // 1) 고른 한 조각이 사라진다
  S.pieces[S.blank].classList.add('gone');
  await wait(VANISH_MS);

  // 2) 나머지가 사방으로 튄다
  // 튄 방향(보드 폭 대비 비율)·회전·겹침 순서를 기록해 두고 GIF에서 똑같이 다시 그린다
  const bp = boardWrap.clientWidth;
  S.scatterFx = S.pieces.map(() => ({ dx:(Math.random()-.5)*.8, dy:(Math.random()-.5)*.8,
                                      rot:(Math.random()-.5)*60, z:Math.floor(Math.random() * 10) }));
  S.pieces.forEach((el, i) => {
    if(i === S.blank) return;
    const fx = S.scatterFx[i];
    el.classList.add('flying');
    el.style.transform += ` translate(${fx.dx*bp}px,${fx.dy*bp}px) rotate(${fx.rot}deg)`;
    el.style.zIndex = fx.z;
  });
  if(navigator.vibrate) navigator.vibrate(30);
  await wait(SCATTER_MS);

  // 3) 섞인 자리에 착지 (pickPiece에서 미리 계산한 배치)
  if(S.nextOrder){ S.order = S.nextOrder; S.nextOrder = null; } else shuffleOrder();
  S.shatterOrder = S.order.slice();
  S.gifJob = null;
  S.pieces.forEach(el => el.style.zIndex = '');
  layout(true);
  await wait(SETTLE_MS);
  S.pieces.forEach(el => el.classList.remove('flying'));
  S.busy = false;

  showShattered();
}

function showShattered(){
  show('shatter');
  setLine('얼굴이 흩어졌습니다.', '');
  setActions([
    ['링크 만들기', 'stamp', makeLink],
    ['직접 맞추기', 'ghost', startPlay],
    ['GIF 저장하기', 'ghost', e => saveGif(e.currentTarget)]
  ]);
  // 버튼을 누르기 전에 미리 만들어 둔다: iOS 공유 시트는 탭 직후에만 열리므로 누를 때 오래 계산하면 막힌다
  setTimeout(prepareGif, 250);
}

function startPlay(){
  show('play');
  setLine('조각을 밀어 얼굴을 되찾으세요.', '조각을 빈칸 쪽으로 끌어서 옮깁니다.');
  setActions([
    ['다시 섞기', 'ghost', reshuffle],
    ['포기하기', 'ghost', giveUp]
  ]);
}

/* 빈칸과 같은 행·열이면 사이 조각을 한꺼번에 민다 */
function onPieceTap(piece){
  if(S.scene === 'pick'){ pickPiece(piece); return; }
  if(S.scene !== 'play' || S.busy || piece === S.blank) return;
  const slot = S.order.indexOf(piece);
  let b = S.order.indexOf(S.blank);
  const sr = Math.floor(slot / COLS), sc = slot % COLS, br = Math.floor(b / COLS), bc = b % COLS;
  if(sr !== br && sc !== bc) return;
  const step = (sr === br) ? (sc > bc ? 1 : -1) : (sr > br ? COLS : -COLS);
  while(b !== slot){
    const nb = b + step;
    [S.order[b], S.order[nb]] = [S.order[nb], S.order[b]];
    b = nb;
  }
  layout(true);
  if(isSolved()){ S.busy = true; setTimeout(finish, 260); }
}

/* ---------- 드래그 이동 ----------
   빈칸과 같은 줄의 조각을 잡으면, 그 조각부터 빈칸 직전까지가 한 덩어리로 손을 따라온다.
   빈칸 방향으로만, 최대 한 칸. 놓을 때 DRAG_COMMIT 이상 밀었거나 빠르게 튕겼으면 확정(onPieceTap 재사용) */
let drag = null;
function slotXY(slot){ const step = cellPx() + S.gap; return [(slot % COLS) * step, Math.floor(slot / COLS) * step]; }

function onPieceDown(piece, e){
  if(S.scene !== 'play' || S.busy || piece === S.blank || drag) return;
  const slot = S.order.indexOf(piece), b = S.order.indexOf(S.blank);
  const sr = Math.floor(slot / COLS), sc = slot % COLS, br = Math.floor(b / COLS), bc = b % COLS;
  if(sr !== br && sc !== bc) return;
  const horiz = (sr === br);
  const dir = horiz ? Math.sign(bc - sc) : Math.sign(br - sr);     // +1 = 오른쪽/아래, -1 = 왼쪽/위
  const stepSlot = horiz ? dir : dir * COLS;
  const group = [];
  for(let s = slot; s !== b; s += stepSlot) group.push(S.order[s]);
  const now = performance.now();
  drag = { piece, id:e.pointerId, x0:e.clientX, y0:e.clientY, horiz, dir, group, d:0, moved:false, v:0, lastD:0, lastT:now };
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  group.forEach(p => S.pieces[p].style.transition = 'none');
}

function onPieceMove(e){
  if(!drag || e.pointerId !== drag.id) return;
  const raw = drag.horiz ? e.clientX - drag.x0 : e.clientY - drag.y0;   // 단위: px
  const step = cellPx() + S.gap;
  const d = Math.max(0, Math.min(step, raw * drag.dir));               // 빈칸 쪽으로 0 ~ 한 칸
  if(Math.abs(raw) > DRAG_TAP_PX) drag.moved = true;
  const now = performance.now();
  drag.v = (d - drag.lastD) / Math.max(1, now - drag.lastT);            // 단위: px/ms
  drag.lastD = d; drag.lastT = now; drag.d = d;
  const ox = drag.horiz ? d * drag.dir : 0, oy = drag.horiz ? 0 : d * drag.dir;
  drag.group.forEach(p => {
    const [x, y] = slotXY(S.order.indexOf(p));
    S.pieces[p].style.transform = `translate(${x + ox}px, ${y + oy}px)`;
  });
}

function onPieceUp(e, cancelled = false){
  if(!drag || e.pointerId !== drag.id) return;
  const g = drag; drag = null;
  g.group.forEach(p => S.pieces[p].style.transition = '');
  if(!g.moved && !cancelled) return;            // 탭: 뒤따르는 click이 처리한다
  S.suppressClick = true;
  setTimeout(() => { S.suppressClick = false; }, 400);
  const step = cellPx() + S.gap;
  const commit = !cancelled && (g.d >= step * DRAG_COMMIT || (g.v >= DRAG_FLICK && g.d > DRAG_TAP_PX));
  if(commit) onPieceTap(g.piece);
  else layout(true);                            // 제자리로 돌아간다
}

function reshuffle(){
  if(S.busy) return;
  shuffleOrder(); layout(true);
  if(navigator.vibrate) navigator.vibrate(20);
}

/* 완성: 사라졌던 조각이 돌아오고, 간격이 닫히고, 도장 */
async function finish(){
  show('done'); S.solved = true;
  S.pieces[S.blank].classList.remove('gone');
  await wait(380);
  S.pieces.forEach(el => el.classList.add('locked'));
  S.gap = 0; layout(true);
  if(navigator.vibrate) navigator.vibrate([25, 60, 90]);
  await wait(560);
  S.busy = false;
  stamp('본인 확인 완료');
  if(S.role === 'receiver'){
    endLink();
    setLine('얼굴을 되찾았습니다.', '');
    setActions([
      ['복수하러 가기', 'stamp', restart],
      ['이미지 저장하기', 'ghost', () => exportImage('얼굴을 되찾았습니다')]
    ]);
    return;
  }
  setLine('얼굴을 되찾았습니다.', '');
  setActions([
    ['이미지 저장하기', 'stamp', () => exportImage('얼굴을 되찾았습니다')],
    ['다른 얼굴 가져오기', 'ghost', restart]
  ]);
}

function giveUp(){
  if(S.busy) return;
  show('done');
  const left = misplaced(S.order);
  setLine('이 얼굴은 이대로 살아갑니다.', `제자리를 못 찾은 조각 ${left}개`);
  stamp('복구 실패');
  if(S.role === 'receiver'){
    endLink();
    setActions([
      ['복수하러 가기', 'stamp', restart],
      ['이미지 저장하기', 'ghost', () => exportImage(`복구 실패 — 남은 조각 ${left}개`)]
    ]);
    return;
  }
  setActions([
    ['이미지 저장하기', 'stamp', () => exportImage(`복구 실패 — 남은 조각 ${left}개`)],
    ['다른 얼굴 가져오기', 'ghost', restart]
  ]);
}

function stamp(text){

  Object.assign(S, { srcBmp:null, viewCv:null, cropCv:null, rot:0, flip:false,
                     gap:GAP_PX, solved:false, busy:false, pieces:[], order:[], nextOrder:null,
                     role:'sender', token:null, linkBusy:false,

/* ---------- 공유 이미지 ---------- */
function renderShareCanvas(caption){
  const W = CROP_W_PX, H = CROP_H_PX;          // 720 × 960 px + 하단 라벨
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H + SHARE_PAD_PX;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);

  if(S.solved){
    ctx.drawImage(S.cropCv, 0, 0, W, H);
  }else{
    ctx.fillStyle = '#2B2B2B'; ctx.fillRect(0, 0, W, H);
    // 조각은 정사각: 가로 기준으로 칸 크기를 정하고 세로도 같은 간격으로 쌓는다
    const g = Math.round(W * .005), cell = (W - g * (COLS - 1)) / COLS;
    S.order.forEach((piece, slot) => {
      if(piece === S.blank) return;
      ctx.drawImage(S.cropCv,
        (piece % COLS) * CELL_PX, Math.floor(piece / COLS) * CELL_PX, CELL_PX, CELL_PX,
        (slot % COLS) * (cell + g), Math.floor(slot / COLS) * (cell + g), cell, cell);
    });
  }

  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#141414'; ctx.font = '700 34px Pretendard, sans-serif';
  ctx.fillText(caption, 28, H + 48);
  ctx.fillStyle = '#6B6B66'; ctx.font = '400 24px Pretendard, sans-serif';
  ctx.fillText('내 얼굴 돌려줘', 28, H + 90);
  return cv;
}

async function exportImage(caption){
  const cv = renderShareCanvas(caption);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .9));
  const file = new File([blob], 'face.jpg', { type:'image/jpeg' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], text:'내 얼굴 돌려줘' }); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'face.jpg'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 해체 GIF ----------
   해체 장면(온전한 얼굴 → 고른 조각 표시 → 사라짐 → 튐 → 착지)을 기록해 둔 값으로 canvas에 다시 그리고,
   자체 GIF 인코더로 묶는다. 외부 라이브러리·네트워크 없음. 마지막 장면에 제목과 게임 주소 */

/* CSS cubic-bezier(.25,1,.35,1)와 같은 감속 곡선 (조각 transform 전환과 맞춤)
   Args: t — 0~1 진행률  Returns: 0~1  Units: 없음 */
function easeBoard(t){
  const x1 = .25, y1 = 1, x2 = .35, y2 = 1;
  const bx = u => 3*x1*u*(1-u)*(1-u) + 3*x2*u*u*(1-u) + u*u*u;
  const by = u => 3*y1*u*(1-u)*(1-u) + 3*y2*u*u*(1-u) + u*u*u;
  let lo = 0, hi = 1, u = t;
  for(let i = 0; i < 24; i++){ u = (lo + hi) / 2; if(bx(u) < t) lo = u; else hi = u; }
  return by(u);
}

/* GIF 한 장면을 그린다
   Args: ctx, items — [{piece, x, y, rot, alpha, z}] (x·y는 조각 왼쪽 위, 단위 px, rot 단위 deg),
         opt — { border: 테두리 칠 조각 번호, caption: 마지막 글씨 표시 여부 }
   Returns: 없음  Units: px */
function drawGifScene(ctx, items, opt = {}){
  const cell = GIF_CELL_PX, g = GAP_PX, bw = cell * COLS + g * (COLS - 1), bh = cell * ROWS + g * (ROWS - 1);
  const bx = (GIF_W_PX - bw) / 2, by = GIF_TOP_PX;
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#E3E3E0'; ctx.fillRect(0, 0, GIF_W_PX, GIF_H_PX);
  ctx.fillStyle = '#2B2B2B'; ctx.fillRect(bx, by, bw, bh);
  items.slice().sort((a, b) => (a.z || 0) - (b.z || 0)).forEach(it => {
    if(it.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = it.alpha;
    ctx.translate(bx + it.x + cell / 2, by + it.y + cell / 2);
    ctx.rotate((it.rot || 0) * Math.PI / 180);
    ctx.drawImage(S.cropCv, (it.piece % COLS) * CELL_PX, Math.floor(it.piece / COLS) * CELL_PX, CELL_PX, CELL_PX,
                  -cell / 2, -cell / 2, cell, cell);
    if(opt.border === it.piece){ ctx.strokeStyle = '#C4311F'; ctx.lineWidth = 3; ctx.strokeRect(-cell / 2 + 1.5, -cell / 2 + 1.5, cell - 3, cell - 3); }
    ctx.restore();
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ty = by + bh;
  if(opt.caption){ ctx.fillStyle = '#141414'; ctx.font = '700 24px Pretendard, sans-serif'; ctx.fillText('얼굴이 흩어졌습니다', GIF_W_PX / 2, ty + 48); }
  ctx.fillStyle = '#6B6B66';
  ctx.font = '600 14px Pretendard, sans-serif'; ctx.fillText(APP_NAME, GIF_W_PX / 2, ty + 88);
  ctx.font = '400 11px Pretendard, sans-serif'; ctx.fillText(GIF_ADDRESS, GIF_W_PX / 2, ty + 110);
}

/* 해체 장면 전체를 프레임 목록으로 만든다
   Returns: [{ img: ImageData, delayMs }]  Units: ms */
async function renderGifFrames(){
  const cv = document.createElement('canvas'); cv.width = GIF_W_PX; cv.height = GIF_H_PX;
  const ctx = cv.getContext('2d', { willReadFrequently:true });
  const step = GIF_CELL_PX + GAP_PX, bw = GIF_CELL_PX * COLS + GAP_PX * (COLS - 1);
  const at = slot => [(slot % COLS) * step, Math.floor(slot / COLS) * step];
  const fx = S.scatterFx, end = S.shatterOrder, blank = S.blank;
  const frames = [];
  const shot = (items, opt, delayMs) => { drawGifScene(ctx, items, opt); frames.push({ img:ctx.getImageData(0, 0, GIF_W_PX, GIF_H_PX), delayMs }); };
  const home = (alphaBlank = 1) => Array.from({ length:CELLS }, (_, p) => { const [x, y] = at(p); return { piece:p, x, y, rot:0, alpha:p === blank ? alphaBlank : 1, z:0 }; });

  // 1) 온전한 얼굴 → 2) 고른 조각 빨간 테두리 → 3) 그 조각이 사라짐 (3장)
  shot(home(), {}, GIF_HOLD_START_MS);
  shot(home(), { border:blank }, PICK_HOLD_MS);
  for(let k = 1; k <= 3; k++) shot(home(1 - k / 3), {}, Math.round(VANISH_MS / 3));
  await wait(0);

  // 4) 튐: 제자리 + 기록된 방향 × 진행률. 남는 시간은 마지막 장에 붙인다(SCATTER_MS − 전환 420 ms)
  const fly = e => Array.from({ length:CELLS }, (_, p) => {
    const [x, y] = at(p);
    return { piece:p, x:x + fx[p].dx * bw * e, y:y + fx[p].dy * bw * e, rot:fx[p].rot * e, alpha:p === blank ? 0 : 1, z:fx[p].z };
  });
  for(let k = 1; k <= GIF_MOVE_FRAMES; k++){
    const last = k === GIF_MOVE_FRAMES;
    shot(fly(easeBoard(k / GIF_MOVE_FRAMES)), {}, GIF_FRAME_MS + (last ? Math.max(0, SCATTER_MS - GIF_MOVE_FRAMES * GIF_FRAME_MS) : 0));
  }
  await wait(0);

  // 5) 착지: 튄 자리에서 섞인 자리로, 회전은 0으로. 마지막 장은 글씨를 띄우고 오래 보여준다
  for(let k = 1; k <= GIF_MOVE_FRAMES; k++){
    const e = easeBoard(k / GIF_MOVE_FRAMES), last = k === GIF_MOVE_FRAMES;
    const items = Array.from({ length:CELLS }, (_, p) => {
      const [x0, y0] = at(p), [x1, y1] = at(end.indexOf(p));
      const sx = x0 + fx[p].dx * bw, sy = y0 + fx[p].dy * bw;
      return { piece:p, x:sx + (x1 - sx) * e, y:sy + (y1 - sy) * e, rot:fx[p].rot * (1 - e), alpha:p === blank ? 0 : 1, z:last ? 0 : fx[p].z };
    });
    shot(items, { caption:last }, last ? GIF_HOLD_END_MS : GIF_FRAME_MS);
  }
  return frames;
}

/* median cut으로 255색 팔레트를 만든다 (255번은 투명 자리로 비워 둔다)
   Args: px — [r,g,b,...] 표본  Returns: [[r,g,b], ...]  Units: 0~255 */
function medianCut(px, n){
  const count = px.length / 3;
  let boxes = [{ ids:Uint32Array.from({ length:count }, (_, i) => i) }];
  const stat = box => {
    let mn = [255,255,255], mx = [0,0,0];
    for(const i of box.ids) for(let c = 0; c < 3; c++){ const v = px[i*3+c]; if(v < mn[c]) mn[c] = v; if(v > mx[c]) mx[c] = v; }
    const r = [mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]], ch = r.indexOf(Math.max(...r));
    box.ch = ch; box.score = r[ch] * Math.sqrt(box.ids.length);
  };
  stat(boxes[0]);
  while(boxes.length < n){
    let bi = -1, best = 0;
    boxes.forEach((b, i) => { if(b.ids.length > 1 && b.score > best){ best = b.score; bi = i; } });
    if(bi < 0) break;
    const b = boxes[bi], ch = b.ch;
    const ids = Array.from(b.ids).sort((a, c) => px[a*3+ch] - px[c*3+ch]);
    const half = ids.length >> 1;
    const A = { ids:Uint32Array.from(ids.slice(0, half)) }, B = { ids:Uint32Array.from(ids.slice(half)) };
    stat(A); stat(B); boxes.splice(bi, 1, A, B);
  }
  return boxes.map(b => {
    const s = [0,0,0]; for(const i of b.ids) for(let c = 0; c < 3; c++) s[c] += px[i*3+c];
    return s.map(v => Math.round(v / b.ids.length));
  });
}

/* GIF89a 인코더: 전역 팔레트 256색(GIF_TRANS = 투명), 무한 반복, 앞 장과 같은 픽셀은 투명으로 비워 용량을 줄인다
   Args: w, h, palette, frames — [{ idx:Uint8Array, delayCs }]  Returns: Uint8Array  Units: delay는 1/100 s */
const GIF_TRANS = 255;
function gifLzw(idx, minSize){
  const clear = 1 << minSize, eoi = clear + 1;
  let size = minSize + 1, next = eoi + 1;
  const dict = new Map(), out = [];
  let cur = 0, bits = 0;
  const emit = c => { cur |= c << bits; bits += size; while(bits >= 8){ out.push(cur & 255); cur >>>= 8; bits -= 8; } };
  emit(clear);
  let prefix = idx[0];
  for(let i = 1; i < idx.length; i++){
    const k = idx[i], key = prefix * 256 + k, v = dict.get(key);
    if(v !== undefined){ prefix = v; continue; }
    emit(prefix);
    if(next < 4096){ dict.set(key, next++); if(next > (1 << size) && size < 12) size++; }
    else{ emit(clear); dict.clear(); size = minSize + 1; next = eoi + 1; }
    prefix = k;
  }
  emit(prefix); emit(eoi);
  if(bits > 0) out.push(cur & 255);
  return out;
}
function gifEncode(w, h, palette, frames){
  const b = [];
  const u16 = n => b.push(n & 255, (n >> 8) & 255);
  const str = t => { for(const ch of t) b.push(ch.charCodeAt(0)); };
  str('GIF89a'); u16(w); u16(h); b.push(0xF7, 0, 0);
  for(let i = 0; i < 256; i++){ const c = palette[i] || [0,0,0]; b.push(c[0], c[1], c[2]); }
  b.push(0x21, 0xFF, 0x0B); str('NETSCAPE2.0'); b.push(3, 1, 0, 0, 0);
  let prev = null;
  for(const f of frames){
    let x0 = 0, y0 = 0, x1 = w - 1, y1 = h - 1, useT = false, data = f.idx;
    if(prev){
      x0 = w; y0 = h; x1 = -1; y1 = -1;
      for(let y = 0; y < h; y++) for(let x = 0, o = y * w; x < w; x++, o++)
        if(f.idx[o] !== prev[o]){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
      if(x1 < 0){ x0 = y0 = x1 = y1 = 0; }
      const rw = x1 - x0 + 1, rh = y1 - y0 + 1;
      data = new Uint8Array(rw * rh); useT = true;
      for(let y = 0; y < rh; y++) for(let x = 0; x < rw; x++){
        const o = (y + y0) * w + x + x0;
        data[y * rw + x] = f.idx[o] === prev[o] ? GIF_TRANS : f.idx[o];
      }
    }
    b.push(0x21, 0xF9, 4, (1 << 2) | (useT ? 1 : 0)); u16(f.delayCs); b.push(GIF_TRANS, 0);
    b.push(0x2C); u16(x0); u16(y0); u16(x1 - x0 + 1); u16(y1 - y0 + 1); b.push(0);
    b.push(8);
    const lz = gifLzw(data, 8);
    for(let i = 0; i < lz.length; i += 255){ const n = Math.min(255, lz.length - i); b.push(n); for(let j = 0; j < n; j++) b.push(lz[i + j]); }
    b.push(0);
    prev = f.idx;
  }
  b.push(0x3B);
  return new Uint8Array(b);
}

/* 해체 GIF를 만든다
   Returns: Blob(image/gif)  Units: 없음 */
async function buildGif(){
  // canvas 글씨는 웹폰트가 실제로 받아진 뒤에 그려야 한다(dynamic subset은 쓰는 글자만 받는다)
  try{
    await Promise.all([
      document.fonts.load('700 24px Pretendard', '얼굴이 흩어졌습니다'),
      document.fonts.load('600 14px Pretendard', APP_NAME),
      document.fonts.load('400 11px Pretendard', GIF_ADDRESS)
    ]);
  }catch(_){}
  const frames = await renderGifFrames();
  // 팔레트: 첫 장(온전한 얼굴)과 마지막 장(흩어진 얼굴 + 글씨)에서 표본을 뽑고, 화면 고정색을 더한다
  const sample = [];
  for(const f of [frames[0], frames[frames.length - 1], frames[1]]){
    const d = f.img.data;
    for(let i = 0; i < d.length; i += 4 * 3) sample.push(d[i], d[i+1], d[i+2]);
  }
  const palette = medianCut(sample, 248);
  [[0xE3,0xE3,0xE0],[0x2B,0x2B,0x2B],[0x14,0x14,0x14],[0x6B,0x6B,0x66],[0xC4,0x31,0x1F],[255,255,255]].forEach(c => palette.push(c));
  await wait(0);
  // 15 bit 색 → 팔레트 번호 캐시 (가장 가까운 색)
  const lut = new Int16Array(32768).fill(-1);
  const nearest = (r, g, b) => {
    let bi = 0, bd = Infinity;
    for(let i = 0; i < palette.length; i++){
      const c = palette[i], dr = r - c[0], dg = g - c[1], db = b - c[2], dd = 2*dr*dr + 4*dg*dg + 3*db*db;
      if(dd < bd){ bd = dd; bi = i; }
    }
    return bi;
  };
  const indexed = [];
  for(const f of frames){
    const d = f.img.data, idx = new Uint8Array(GIF_W_PX * GIF_H_PX);
    for(let p = 0, i = 0; p < idx.length; p++, i += 4){
      const key = ((d[i] >> 3) << 10) | ((d[i+1] >> 3) << 5) | (d[i+2] >> 3);
      let v = lut[key];
      if(v < 0){ v = nearest(d[i], d[i+1], d[i+2]); lut[key] = v; }
      idx[p] = v;
    }
    indexed.push({ idx, delayCs:Math.round(f.delayMs / 10) });   // ms → 1/100 s
    await wait(0);
  }
  return new Blob([gifEncode(GIF_W_PX, GIF_H_PX, palette, indexed)], { type:'image/gif' });
}

/* 미리 만들어 둔다(보내는 쪽 해체 직후). 이미 만들고 있으면 그 작업을 돌려준다 */
function prepareGif(){
  if(!S.gifJob && S.scatterFx && S.shatterOrder && S.cropCv){
    const job = buildGif().catch(() => null);
    job.then(() => { job.done = true; });
    S.gifJob = job;
  }
  return S.gifJob;
}

/* [GIF 저장하기] — 공유 시트(iOS: 이미지 저장·카톡)로 넘기고, 없으면 내려받기 */
async function saveGif(btn){
  if(btn.dataset.busy) return;
  const ready = S.gifJob && S.gifJob.done;
  btn.dataset.busy = '1';
  if(!ready){ btn.textContent = 'GIF 만드는 중…'; btn.disabled = true; }
  const job = prepareGif();
  const blob = job ? await job : null;
  btn.disabled = false; delete btn.dataset.busy;
  if(!blob){ btn.textContent = 'GIF를 만들 수 없습니다'; return; }
  btn.textContent = 'GIF 저장하기';
  const file = new File([blob], 'face.gif', { type:'image/gif' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file] }); return; }
    catch(e){
      if(e.name === 'AbortError') return;
      // 만드는 동안 탭 직후 허용 시간이 지나 막힌 경우: 이제 준비됐으니 한 번 더 누르면 바로 열린다
      if(e.name === 'NotAllowedError'){ btn.textContent = '한 번 더 눌러주세요'; return; }
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'face.gif'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 저장소: Supabase Storage REST ----------
   저장소를 바꾸면 이 객체만 교체한다. 라이브러리 없이 fetch만 쓴다 */
const store = {
  headers(extra = {}){ return Object.assign({ apikey:SUPABASE.key }, extra); },
  path(name){ return `${SUPABASE.url}/storage/v1/object/${SUPABASE.bucket}/${name}`; },

  /* 업로드. 같은 이름 덮어쓰기는 버킷 정책이 막는다.
     cache-control max-age=0: 지운 뒤 CDN에 남는 시간을 줄인다(실측: 일반 주소는 약 1분 잔존)
     Args: name — 파일 이름, blob — JPEG  Returns: 없음(실패 시 throw) */
  async put(name, blob){
    const res = await fetch(this.path(name), {
      method:'POST', headers:this.headers({ 'Content-Type':'image/jpeg', 'cache-control':'max-age=0' }), body:blob
    });
    if(!res.ok) throw new Error('upload ' + res.status);
  },

  /* 읽기(공개 버킷 경로). 매번 다른 쿼리를 붙여 CDN 사본 대신 원본 상태를 확인한다:
     이미 지워진 사진이 캐시로 되살아나면 안 된다(실측: 쿼리를 붙이면 삭제 직후 바로 404)
     Returns: Blob 또는 null(없거나 지워짐) */
  async get(name){
    try{
      const res = await fetch(`${SUPABASE.url}/storage/v1/object/public/${SUPABASE.bucket}/${name}?v=${Date.now()}`,
                              { cache:'no-store' });
      if(!res.ok) return null;
      const blob = await res.blob();
      return blob.type.startsWith('image/') ? blob : null;
    }catch(e){ return null; }
  },

  /* 삭제. 실패해도 1시간 만료가 뒤를 받친다. 페이지를 떠나도 요청이 끝나도록 keepalive */
  async del(name){
    try{ await fetch(this.path(name), { method:'DELETE', headers:this.headers(), keepalive:true }); }
    catch(e){}
  }
};

/* ---------- 링크 형식: #t=토큰&p=순열&b=빈칸 ----------
   토큰 = 생성 시각(36진수) + '_' + 난수 16 B(base64url, 22자). '#' 뒤는 서버로 가지 않아 미리보기 봇이 못 본다 */
const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';

function newToken(){
  const r = crypto.getRandomValues(new Uint8Array(16));
  const b64 = btoa(String.fromCharCode(...r)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return Date.now().toString(36) + '_' + b64;
}
const fileName = token => token + '.jpg';

/* 순열 → 칸마다 36진수 한 글자 (12칸 → 12자) */
function encodeLink(token, order, blank){
  const p = order.map(n => B36[n]).join('');
  const sep = (LINK_IN === 'query') ? '?' : '#';
  return `${location.origin}${location.pathname}${sep}t=${token}&p=${p}&b=${B36[blank]}`;
}

/* 해시를 읽어 검증한다. 형식이 틀리거나 풀 수 없는 배치면 null
   Returns: { token, createdMs, order, blank } | null */
function linkParams(){
  if(/[#&]t=/.test(location.hash)) return location.hash.replace(/^#/, '');
  if(/[?&]t=/.test(location.search)) return location.search.replace(/^\?/, '');
  return '';
}
function decodeLink(raw){
  const q = new URLSearchParams(raw);
  const t = q.get('t') || '', p = q.get('p') || '', b = q.get('b') || '';
  if(!/^[0-9a-z]{6,12}_[A-Za-z0-9_-]{22}$/.test(t)) return null;
  if(p.length !== CELLS || b.length !== 1) return null;
  const order = [...p].map(ch => B36.indexOf(ch));
  const blank = B36.indexOf(b);
  if(blank < 0 || blank >= CELLS) return null;
  if(order.some(n => n < 0 || n >= CELLS) || new Set(order).size !== CELLS) return null;
  if(!solvable(order, blank)) return null;
  const createdMs = parseInt(t.split('_')[0], 36);
  return { token:t, createdMs, order, blank };
}

/* 풀 수 있는가: 순열의 홀짝 = 빈칸이 제자리까지 가는 Manhattan 거리의 홀짝 */
function solvable(order, blank){
  let inv = 0;
  const seen = new Array(CELLS).fill(false);
  for(let i = 0; i < CELLS; i++){            // 순환 분해로 순열 홀짝 계산
    if(seen[i]) continue;
    let j = i, len = 0;
    while(!seen[j]){ seen[j] = true; j = order[j]; len++; }
    inv += len - 1;
  }
  const s = order.indexOf(blank);
  const dist = Math.abs(Math.floor(s / COLS) - Math.floor(blank / COLS)) + Math.abs(s % COLS - blank % COLS);
  return (inv % 2) === (dist % 2);
}

/* 완성 얼굴(720×960)을 상한 이하 JPEG로 만든다
   Returns: Blob  Units: 상한 UPLOAD_MAX_B는 B */
async function encodeUpload(){
  let blob = null;
  for(const q of UPLOAD_QUALITY){
    blob = await new Promise(r => S.cropCv.toBlob(r, 'image/jpeg', q));
    if(blob && blob.size <= UPLOAD_MAX_B) return blob;
  }
  throw new Error('too large');
}

/* 보내는 쪽: 사진을 올리고 링크 화면을 띄운다 */
async function makeLink(){
  if(S.linkBusy || S.busy) return;
  S.linkBusy = true;
  setLine('링크를 만드는 중입니다.', '잠시만 기다려주세요.');
  setActions([['링크 만드는 중…', 'stamp', () => {}]]);
  $('boardActions').firstChild.disabled = true;
  try{
    const token = newToken();
    await store.put(fileName(token), await encodeUpload());
    S.token = token;
    showLinkScreen(encodeLink(token, S.order, S.blank));
  }catch(e){
    setLine('지금은 링크를 만들 수 없습니다.', '잠시 뒤 다시 시도하거나 이미지로 보내주세요.');
    setActions([
      ['다시 시도', 'stamp', makeLink],
      ['GIF 저장하기', 'ghost', e => saveGif(e.currentTarget)],
      ['직접 맞추기', 'ghost', startPlay]
    ]);
  }finally{
    S.linkBusy = false;
  }
}

function showLinkScreen(url){
  show('link');
  setLine('이 주소를 친구에게 보내세요.', '친구가 다 맞추거나 포기하면 사진은 지워집니다.\n안 열어도 1시간 뒤엔 지워집니다.');
  const canShare = typeof navigator.share === 'function';
  setActions([
    ...(canShare ? [['카톡으로 보내기', 'stamp', e => shareLink(url, e.currentTarget)]] : []),
    ['주소 복사', canShare ? 'ghost' : 'stamp', e => copyLink(url, e.currentTarget)],
    ['GIF 저장하기', 'ghost', e => saveGif(e.currentTarget)],
    ['내가 먼저 풀어보기', 'ghost', startPlay]
  ]);
}

/* 공유 시트(iOS: 카톡·문자 등). 닫으면 조용히 무시, 다른 오류면 복사로 대체 */
let sharing = false;
async function shareLink(url, btn){
  if(sharing) return;                       // 연타 방지: 공유 시트가 떠 있는 동안 무시
  sharing = true; btn.disabled = true;
  try{
    await navigator.share(SHARE_TEXT ? { text:SHARE_TEXT, url } : { url });
  }catch(e){
    if(e.name !== 'AbortError'){
      const copyBtn = [...$('boardActions').children].find(b => b.textContent === '주소 복사');
      if(copyBtn) copyLink(url, copyBtn);
    }
  }finally{
    sharing = false;
    if(btn.isConnected) btn.disabled = false;
  }
}

/* 클립보드 복사. 실패하면 선택 가능한 입력창으로 보여준다 */
async function copyLink(url, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(url); ok = true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, url.length);
    try{ ok = document.execCommand('copy'); }catch(e2){}
    ta.remove();
  }
  if(!ok){ window.prompt('주소를 길게 눌러 복사하세요.', url); return; }
  btn.textContent = '복사했습니다';
  if(navigator.vibrate) navigator.vibrate(15);
  setTimeout(() => { if(btn.isConnected) btn.textContent = '주소 복사'; }, COPY_DONE_MS);
}

/* 주소창에서 링크 정보(#… 또는 ?…)를 지운다. 새로고침해도 받는 쪽으로 다시 들어가지 않게 */
function clearLinkFromAddressBar(){
  if(location.hash || location.search) history.replaceState(null, '', location.pathname);
}

/* 받는 쪽: 게임이 끝나면 사진을 지우고, 주소창의 링크도 지운다 */
function endLink(){
  if(!S.token) return;
  store.del(fileName(S.token));
  S.token = null;
  clearLinkFromAddressBar();
}

function showExpired(){
  show('expired');
  board.innerHTML = ''; S.pieces = [];
  setLine('이 얼굴은 이미 사라졌습니다.', '하지만 복수할 수는 있습니다.');
  stamp('만료');
  setActions([['그 친구 얼굴 흩어버리기', 'stamp', restart]]);
}

/* 받는 쪽 진입: 링크 검증 → 만료 확인 → 사진 받기 → 같은 배치로 펼침 → 도착 팝업 */
async function openLink(){
  const link = decodeLink(linkParams());
  S.role = 'receiver';
  if(!link){ showExpired(); return; }
  if(Date.now() - link.createdMs > LINK_TTL_MS){
    store.del(fileName(link.token));   // 아무도 안 연 채 남은 파일이면 여기서 청소된다
    showExpired(); return;
  }
  show('load');
  setLine('얼굴을 가져오는 중입니다.', ''); setActions([]);
  const blob = await store.get(fileName(link.token));
  if(!blob){ showExpired(); return; }

  try{
    const bmp = await createImageBitmap(blob);
    const cv = document.createElement('canvas');
    cv.width = CROP_W_PX; cv.height = CROP_H_PX;
    cv.getContext('2d').drawImage(bmp, 0, 0, CROP_W_PX, CROP_H_PX);
    S.cropCv = cv;
  }catch(e){ showExpired(); return; }

  S.token = link.token; S.blank = link.blank;
  S.solved = false; S.gap = GAP_PX;
  buildPieces();
  S.order = link.order;
  S.pieces[S.blank].classList.add('gone');
  layout(false);
  show('shatter');
  setLine('얼굴이 흩어졌습니다.', ''); setActions([]);
  $('docNo').textContent = 'no. ' + link.token.slice(-6).toUpperCase();
  $('modalArrive').classList.add('on');
}

/* ---------- 문의 ---------- */
function contactCount(){
  const key = 'contact-' + new Date().toISOString().slice(0, 10);
  let n = 0;
  try{ n = parseInt(localStorage.getItem(key) || '0', 10); }catch(e){}
  return { key, n };
}
/* 문의: 보내는 동안 버튼을 잠가 중복 전송을 막고, 결과를 버튼과 문구 둘 다로 보여준다 */
let contactSending = false;
const sendBtn = $('btnContactSend');

function contactUI(state, msg = ''){
  const note = $('contactNote');
  note.textContent = msg;
  note.classList.toggle('ok',  state === 'done');
  note.classList.toggle('err', state === 'error');
  sendBtn.disabled = (state === 'sending' || state === 'done');
  sendBtn.textContent = { sending:'보내는 중…', done:'보냈습니다', error:'다시 보내기' }[state] || '보내기';
}

function closeContact(){
  $('modalContact').classList.remove('on');
  if(!contactSending) contactUI('idle');
}

$('btnContact').onclick = () => {
  if(!contactSending) contactUI('idle', EMAILJS.publicKey ? '' : '전송 설정이 아직 연결되지 않았습니다.');
  $('modalContact').classList.add('on');
};
$('btnContactClose').onclick = closeContact;
sendBtn.onclick = async () => {
  if(contactSending) return;                          // 연타 방지: 첫 탭 이후는 무시
  const text = $('contactText').value.trim();
  if(!text){ contactUI('idle', '내용을 적어주세요.'); return; }
  if(!EMAILJS.publicKey){ contactUI('idle', '전송 설정이 아직 연결되지 않았습니다.'); return; }
  const { key, n } = contactCount();
  if(n >= CONTACT_CAP){ contactUI('error', '오늘은 더 보낼 수 없습니다. 내일 다시 시도해주세요.'); sendBtn.disabled = true; return; }

  contactSending = true;
  contactUI('sending', '보내는 중입니다. 잠시만 기다려주세요.');
  try{
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        service_id:EMAILJS.serviceId, template_id:EMAILJS.templateId, user_id:EMAILJS.publicKey,
        template_params:{ message:text, app:`${APP_NAME} ${APP_VERSION}`, ua:navigator.userAgent }
      })
    });
    if(!res.ok) throw new Error(res.status);
    try{ localStorage.setItem(key, String(n + 1)); }catch(e){}
    $('contactText').value = '';
    contactUI('done', '개발자에게 전달했습니다. 고맙습니다.');
    if(navigator.vibrate) navigator.vibrate(20);
    await wait(CONTACT_DONE_MS);
    contactSending = false;
    closeContact();
  }catch(e){
    contactSending = false;
    contactUI('error', '전송에 실패했습니다. 잠시 뒤 다시 보내주세요.');
  }
};

/* ---------- 배선 ---------- */
$('btnCamera').onclick = () => $('fileCamera').click();
$('btnAlbum').onclick  = () => $('fileAlbum').click();
$('fileCamera').onchange = e => loadFile(e.target.files[0], true);
$('fileAlbum').onchange  = e => loadFile(e.target.files[0]);
$('btnRotL').onclick = () => { S.rot = (S.rot + 270) % 360; rebuildView(); };
$('btnRotR').onclick = () => { S.rot = (S.rot + 90) % 360; rebuildView(); };
$('btnFlip').onclick = () => {
  S.flip = !S.flip;
  $('btnFlip').setAttribute('aria-pressed', String(S.flip));
  rebuildView();
};
$('btnCropBack').onclick = () => show('intro');
$('btnCropDone').onclick = () => { bakeCrop(); runPick(); };
$('btnRestart').onclick = restart;
board.addEventListener('pointermove', onPieceMove);
board.addEventListener('pointerup', e => onPieceUp(e));
board.addEventListener('pointercancel', e => onPieceUp(e, true));
$('btnArriveStart').onclick = () => { $('modalArrive').classList.remove('on'); startPlay(); };

// 진입 분기: 해시에 토큰이 있으면 받는 쪽
if(linkParams()) openLink();
// 이미 열린 탭에서 다른 링크 주소로 바뀌면 새로 연다
window.addEventListener('hashchange', () => { if(/[#&]t=/.test(location.hash)) location.reload(); });

window.addEventListener('resize', () => {
  if(S.scene === 'crop' && S.viewCv) rebuildView();
  if(S.pieces.length) layout(false);
});

if(screen.orientation && screen.orientation.lock){
  screen.orientation.lock('portrait').catch(() => {});
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
