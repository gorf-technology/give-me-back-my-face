<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#9FB8C6">
<meta name="description" content="친구 얼굴을 조각내고 섞는 퍼즐. 사진은 이 기기 밖으로 나가지 않습니다.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="내 얼굴 돌려줘">
<link rel="manifest" href="manifest.json">
<title>내 얼굴 돌려줘</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --booth:#9FB8C6;
  --booth-deep:#7E9CAC;
  --card:#FCFCFB;
  --ink:#16232B;
  --muted:#5F7784;
  --line:#C9D6DE;
  --stamp:#B33A2E;
  --board:min(86vw, 360px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);
  background:radial-gradient(ellipse at 50% 30%, #B6CBD6 0%, var(--booth) 46%, var(--booth-deep) 100%);
  display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

header{
  width:100%;max-width:520px;
  padding:calc(env(safe-area-inset-top) + 16px) 20px 0;
  display:flex;justify-content:space-between;align-items:baseline;
}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:10px;letter-spacing:.22em;color:#3E5866;opacity:.7}

main{
  flex:1;width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 20px;gap:18px;
}
.screen{display:none;flex-direction:column;align-items:center;gap:16px;width:100%}
.screen.on{display:flex}

.status{text-align:center;min-height:50px;display:flex;flex-direction:column;gap:5px;justify-content:center}
.status .line{font-size:19px;font-weight:700;letter-spacing:-.02em}
.status .sub{font-size:12.5px;color:#31505E;line-height:1.5}

.btn{
  padding:14px 20px;border-radius:2px;background:var(--ink);color:#F2F6F8;
  font-size:15px;font-weight:600;letter-spacing:-.01em;width:100%;
  transition:transform .08s ease;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:#223B47;border:1px solid #7E9CAC}
.btn.stamp{background:var(--stamp);color:#fff}
.row{display:flex;gap:10px;width:100%}
.stack{display:flex;flex-direction:column;gap:9px;width:100%;max-width:var(--board)}

/* 시작 화면 */
.slate{
  width:var(--board);aspect-ratio:1;background:var(--card);
  border:1px solid var(--line);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 18px 40px -24px rgba(10,30,45,.55);
}
.slate::after{content:"";position:absolute;inset:9px;border:1px dashed var(--line);pointer-events:none}
.slate .glyph{font-size:46px;line-height:1;color:#B6C7D1}
.slate .cap{font-size:12.5px;color:var(--muted);text-align:center;padding:0 26px;line-height:1.65}

/* 크롭 */
#cropFrame{
  width:var(--board);aspect-ratio:1;position:relative;overflow:hidden;
  background:#26343C;border:1px solid var(--line);touch-action:none;
  box-shadow:0 18px 40px -24px rgba(10,30,45,.55);
}
#cropImg{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.cropGuide{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to right,transparent 33.3%,rgba(255,255,255,.15) 33.3%,rgba(255,255,255,.15) calc(33.3% + 1px),transparent calc(33.3% + 1px)),
    linear-gradient(to right,transparent 66.6%,rgba(255,255,255,.15) 66.6%,rgba(255,255,255,.15) calc(66.6% + 1px),transparent calc(66.6% + 1px)),
    linear-gradient(to bottom,transparent 33.3%,rgba(255,255,255,.15) 33.3%,rgba(255,255,255,.15) calc(33.3% + 1px),transparent calc(33.3% + 1px)),
    linear-gradient(to bottom,transparent 66.6%,rgba(255,255,255,.15) 66.6%,rgba(255,255,255,.15) calc(66.6% + 1px),transparent calc(66.6% + 1px));
}
.tools{display:flex;gap:8px;width:100%;max-width:var(--board);justify-content:center}
.tool{
  padding:9px 16px;border:1px solid #7E9CAC;border-radius:2px;
  font-size:12.5px;color:#223B47;background:rgba(252,252,251,.5);
}
.tool:active{background:#fff}

/* 난이도 */
.levels{display:flex;flex-direction:column;gap:8px;width:100%;max-width:var(--board)}
.level{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:var(--card);border:1px solid var(--line);border-radius:2px;text-align:left;
}
.level[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.level .n{font-size:11px;letter-spacing:.1em;color:var(--muted);min-width:36px}
.level .t{font-size:15px;font-weight:600;display:block}
.level .d{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}

/* 보드 */
#boardWrap{position:relative;width:var(--board);aspect-ratio:1}
#board{position:absolute;inset:0;background:#2A3941;box-shadow:0 18px 40px -24px rgba(10,30,45,.6)}
.piece{
  position:absolute;top:0;left:0;background-repeat:no-repeat;
  transition:transform .42s cubic-bezier(.22,1,.28,1),
             width .3s ease, height .3s ease,
             background-size .3s ease, background-position .3s ease;
  will-change:transform;
}
.piece.sel{outline:2px solid var(--stamp);outline-offset:-2px;z-index:5}
.piece.locked{transition-duration:.6s}
@media (prefers-reduced-motion:reduce){.piece{transition-duration:.01ms !important}}

#stampMark{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-11deg) scale(2.4);
  opacity:0;pointer-events:none;z-index:20;
  color:var(--stamp);border:3px double var(--stamp);
  padding:9px 18px;font-size:21px;font-weight:800;letter-spacing:.05em;
  background:rgba(252,252,251,.86);
  transition:transform .22s cubic-bezier(.2,1.4,.4,1),opacity .16s ease;
}
#stampMark.on{transform:translate(-50%,-50%) rotate(-11deg) scale(1);opacity:1}

footer{
  width:100%;max-width:520px;
  padding:0 20px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;justify-content:space-between;align-items:center;
}
.util{font-size:11.5px;color:#3E5866;opacity:.75;padding:8px 4px}

.modal{position:fixed;inset:0;background:rgba(14,28,36,.55);display:none;align-items:center;justify-content:center;padding:22px;z-index:60}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:400px;padding:22px;display:flex;flex-direction:column;gap:13px}
.sheet h2{margin:0;font-size:17px;letter-spacing:-.02em}
.sheet p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
textarea{width:100%;min-height:110px;padding:12px;border:1px solid var(--line);border-radius:2px;font:inherit;font-size:14px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.note{font-size:11.5px;color:var(--muted);min-height:16px}
input[type=file]{display:none}

/* 가로모드 차단 — 이 게임은 정사각 보드가 전제라 세로에서만 굴린다 */
#rotateGate{
  position:fixed;inset:0;z-index:100;display:none;
  background:var(--booth-deep);
  flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;
}
#rotateGate .big{font-size:22px;font-weight:800;letter-spacing:-.02em}
#rotateGate .small{font-size:13px;color:#26404C}
#rotateGate .icon{font-size:40px;margin-bottom:6px}
@media (orientation:landscape) and (max-height:520px){
  #rotateGate{display:flex}
}
</style>
</head>
<body>

<header>
  <h1>내 얼굴 돌려줘</h1>
  <span class="eyebrow mono" id="docNo">no. ------</span>
</header>

<main>
  <!-- 시작 -->
  <section class="screen on" id="scIntro">
    <div class="slate">
      <div class="glyph">◻︎</div>
      <div class="cap">소중한 친구의 사진을 올려주세요.<br>여러 명이 나온 사진도 됩니다.<br>한꺼번에 망가집니다.</div>
    </div>
    <div class="stack">
      <button class="btn" id="btnCamera">사진 찍기</button>
      <button class="btn ghost" id="btnAlbum">앨범에서 고르기</button>
    </div>
    <div class="status"><div class="sub">사진은 이 기기 밖으로 나가지 않습니다.</div></div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment">
    <input type="file" id="fileAlbum" accept="image/*">
  </section>

  <!-- 크롭 -->
  <section class="screen" id="scCrop">
    <div class="status">
      <div class="line">얼굴이 잘 보이게 맞춰주세요.</div>
      <div class="sub">끌어서 옮기고, 두 손가락으로 확대합니다.</div>
    </div>
    <div id="cropFrame">
      <img id="cropImg" alt="">
      <div class="cropGuide"></div>
    </div>
    <div class="tools">
      <button class="tool" id="btnRotL">↺ 왼쪽으로</button>
      <button class="tool" id="btnRotR">오른쪽으로 ↻</button>
    </div>
    <div class="stack">
      <button class="btn" id="btnCropDone">이 얼굴로 하기</button>
      <button class="btn ghost" id="btnCropBack">다른 사진 고르기</button>
    </div>
  </section>

  <!-- 난이도 -->
  <section class="screen" id="scLevel">
    <div class="status"><div class="line">얼마나 망가뜨릴까요?</div></div>
    <div class="levels">
      <button class="level" data-n="3" aria-pressed="false">
        <span class="n mono">3 × 3</span>
        <span><span class="t">살짝 구겨짐</span><span class="d">아직 사람으로 보입니다</span></span>
      </button>
      <button class="level" data-n="4" aria-pressed="true">
        <span class="n mono">4 × 4</span>
        <span><span class="t">얼굴 붕괴</span><span class="d">권장합니다</span></span>
      </button>
      <button class="level" data-n="5" aria-pressed="false">
        <span class="n mono">5 × 5</span>
        <span><span class="t">신원 불명</span><span class="d">책임지지 않습니다</span></span>
      </button>
    </div>
    <div class="stack"><button class="btn" id="btnShatter">시작</button></div>
  </section>

  <!-- 보드: 해체 · 퍼즐 · 결과 공용 -->
  <section class="screen" id="scBoard">
    <div class="status">
      <div class="line" id="boardLine">감사합니다.</div>
      <div class="sub" id="boardSub"></div>
    </div>
    <div id="boardWrap">
      <div id="board"></div>
      <div id="stampMark">본인 확인 완료</div>
    </div>
    <div class="stack" id="boardActions"></div>
  </section>
</main>

<footer>
  <button class="util" id="btnContact">개발자에게 항의</button>
  <button class="util" id="btnRestart" style="visibility:hidden">처음으로</button>
</footer>

<div class="modal" id="modalContact">
  <div class="sheet">
    <h2>개발자에게 항의</h2>
    <p>사진은 전송되지 않습니다. 적어주신 내용만 전달됩니다.</p>
    <textarea id="contactText" placeholder="무엇이 마음에 안 드셨는지 적어주세요."></textarea>
    <div class="note" id="contactNote"></div>
    <div class="row">
      <button class="btn ghost" id="btnContactClose">닫기</button>
      <button class="btn" id="btnContactSend">보내기</button>
    </div>
  </div>
</div>

<div id="rotateGate">
  <div class="icon">◱</div>
  <div class="big">얼굴이 누웠습니다.</div>
  <div class="small">화면을 세로로 돌려주세요.</div>
</div>

<script>
/* =========================================================
   내 얼굴 돌려줘 v1.0.0
   저장소 없음 — 사진은 이 기기 밖으로 나가지 않는다.
   2차 예정: storage.js(Supabase 1회용 링크) + 피해자 라인 + GIF
   ========================================================= */

/* ---------- 설정값 ---------- */
const APP_VERSION    = 'v1.0.0';
const CROP_SIZE_PX   = 800;   // 크롭 결과 캔버스 한 변, 단위: px
const SHARE_PAD_PX   = 130;   // 공유 이미지 하단 라벨 높이, 단위: px
const GAP_PX         = 3;     // 조각 사이 간격, 단위: px
const HOLD_MS        = 1000;  // 원본 노출 시간, 단위: ms
const SCATTER_MS     = 900;   // 흩어짐 지속, 단위: ms
const SETTLE_MS      = 480;   // 착지 후 대기, 단위: ms
const MAX_ZOOM       = 6;     // 크롭 최대 확대 배율
const CONTACT_CAP    = 5;     // 기기당 하루 문의 상한, 단위: 건

// EmailJS — 배포 전에 채운다. 비어 있으면 문의 전송이 꺼진다.
const EMAILJS = { publicKey:'', serviceId:'', templateId:'' };

/* ---------- 상태 ---------- */
const S = {
  scene  : 'intro',
  srcBmp : null,   // 원본 ImageBitmap
  viewCv : null,   // 회전 반영된 표시용 canvas
  cropCv : null,   // 크롭 결과 canvas
  rot    : 0,      // 사용자 회전 각도, 단위: deg (0/90/180/270)
  n      : 4,
  order  : [],     // order[slot] = pieceIndex
  pieces : [],
  sel    : -1,
  gap    : GAP_PX,
  crop   : { scale:1, base:1, tx:0, ty:0 }
};

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));
const board = $('board'), boardWrap = $('boardWrap');
const cropFrame = $('cropFrame'), cropImg = $('cropImg');
let frameSize = 0;

/* ---------- 화면 전환 ---------- */
function show(name){
  S.scene = name;
  const map = { intro:'scIntro', crop:'scCrop', level:'scLevel',
                shatter:'scBoard', play:'scBoard', done:'scBoard' };
  ['scIntro','scCrop','scLevel','scBoard']
    .forEach(id => $(id).classList.toggle('on', map[name] === id));
  $('btnRestart').style.visibility = (name === 'intro') ? 'hidden' : 'visible';
}
function setLine(line, sub){
  $('boardLine').textContent = line;
  $('boardSub').textContent = sub || '';
}
function setActions(list){
  const wrap = $('boardActions');
  wrap.innerHTML = '';
  list.forEach(([label, cls, fn]) => {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || '');
    b.textContent = label; b.onclick = fn;
    wrap.appendChild(b);
  });
}

/* ---------- 사진 읽기 ----------
   imageOrientation:'from-image' 이 EXIF 회전 태그를 반영한다.
   EXIF가 없거나 틀린 사진은 크롭 화면의 회전 버튼으로 사용자가 바로잡는다. */
async function loadFile(file){
  if(!file) return;
  let bmp;
  try{
    bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
  }catch(e){
    bmp = await createImageBitmap(file);
  }
  S.srcBmp = bmp;
  S.rot = 0;
  rebuildView();
  show('crop');
  $('docNo').textContent = 'no. ' + Math.random().toString(36).slice(2,8).toUpperCase();
}

/* 회전을 반영한 표시용 canvas를 다시 만든다 */
function rebuildView(){
  const b = S.srcBmp, r = S.rot;
  const swap = (r === 90 || r === 270);
  const cv = document.createElement('canvas');
  cv.width  = swap ? b.height : b.width;
  cv.height = swap ? b.width  : b.height;
  const ctx = cv.getContext('2d');
  ctx.translate(cv.width / 2, cv.height / 2);
  ctx.rotate(r * Math.PI / 180);
  ctx.drawImage(b, -b.width / 2, -b.height / 2);
  S.viewCv = cv;

  cropImg.src = cv.toDataURL('image/jpeg', .92);
  cropImg.style.width  = cv.width + 'px';
  cropImg.style.height = cv.height + 'px';

  frameSize = cropFrame.clientWidth;
  const base = Math.max(frameSize / cv.width, frameSize / cv.height);
  S.crop.base = base; S.crop.scale = base;
  S.crop.tx = (frameSize - cv.width  * base) / 2;
  S.crop.ty = (frameSize - cv.height * base) / 2;
  applyCrop();
}

/* ---------- 크롭 조작 ---------- */
function clampCrop(){
  const w = S.viewCv.width * S.crop.scale, h = S.viewCv.height * S.crop.scale;
  S.crop.tx = Math.min(0, Math.max(frameSize - w, S.crop.tx));
  S.crop.ty = Math.min(0, Math.max(frameSize - h, S.crop.ty));
}
function applyCrop(){
  clampCrop();
  cropImg.style.transform =
    `translate(${S.crop.tx}px, ${S.crop.ty}px) scale(${S.crop.scale})`;
}

const ptrs = new Map();
let pinch0 = null;

function snapshotPinch(){
  const [a,b] = [...ptrs.values()];
  const r = cropFrame.getBoundingClientRect();
  return {
    dist:Math.hypot(a.x-b.x, a.y-b.y),
    cx:(a.x+b.x)/2 - r.left, cy:(a.y+b.y)/2 - r.top,
    scale:S.crop.scale, tx:S.crop.tx, ty:S.crop.ty
  };
}
function zoomAt(target, cx, cy, from){
  const k = target / from.scale;
  S.crop.tx = cx - (cx - from.tx) * k;
  S.crop.ty = cy - (cy - from.ty) * k;
  S.crop.scale = target;
  applyCrop();
}

cropFrame.addEventListener('pointerdown', e => {
  cropFrame.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(ptrs.size === 2) pinch0 = snapshotPinch();
});
cropFrame.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(ptrs.size === 1){
    S.crop.tx += e.clientX - prev.x;
    S.crop.ty += e.clientY - prev.y;
    applyCrop();
  }else if(ptrs.size === 2 && pinch0){
    const now = snapshotPinch();
    const target = Math.min(S.crop.base * MAX_ZOOM,
                   Math.max(S.crop.base, pinch0.scale * (now.dist / pinch0.dist)));
    zoomAt(target, now.cx, now.cy, pinch0);
  }
});
['pointerup','pointercancel','pointerleave'].forEach(t =>
  cropFrame.addEventListener(t, e => { ptrs.delete(e.pointerId); pinch0 = null; }));

cropFrame.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cropFrame.getBoundingClientRect();
  const target = Math.min(S.crop.base * MAX_ZOOM,
                 Math.max(S.crop.base, S.crop.scale * (e.deltaY < 0 ? 1.1 : .9)));
  zoomAt(target, e.clientX - r.left, e.clientY - r.top,
         { scale:S.crop.scale, tx:S.crop.tx, ty:S.crop.ty });
}, { passive:false });

/* 크롭 확정 — 원본 비율은 건드리지 않는다. 늘이면 다른 사람 얼굴이 된다. */
function bakeCrop(){
  const s = S.crop.scale;
  const sx = -S.crop.tx / s, sy = -S.crop.ty / s, side = frameSize / s;
  const cv = document.createElement('canvas');
  cv.width = cv.height = CROP_SIZE_PX;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(S.viewCv, sx, sy, side, side, 0, 0, CROP_SIZE_PX, CROP_SIZE_PX);
  S.cropCv = cv;
}

/* ---------- 퍼즐 ---------- */
const cellPx = () => (boardWrap.clientWidth - S.gap * (S.n - 1)) / S.n;

function buildPieces(){
  board.innerHTML = ''; S.pieces = [];
  const url = S.cropCv.toDataURL('image/jpeg', .9);
  const cell = cellPx();
  for(let i = 0; i < S.n * S.n; i++){
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.width = el.style.height = cell + 'px';
    el.style.backgroundImage = `url(${url})`;
    el.onclick = () => onPieceTap(i);
    board.appendChild(el);
    S.pieces.push(el);
  }
  S.order = S.pieces.map((_, i) => i);
  layout(false);
}

function layout(animate = true){
  const cell = cellPx(), step = cell + S.gap;
  if(!animate) S.pieces.forEach(el => el.style.transition = 'none');
  S.order.forEach((piece, slot) => {
    const el = S.pieces[piece];
    el.style.width = el.style.height = cell + 'px';
    el.style.backgroundSize = `${cell * S.n}px ${cell * S.n}px`;
    el.style.backgroundPosition =
      `${-(piece % S.n) * cell}px ${-Math.floor(piece / S.n) * cell}px`;
    el.style.transform =
      `translate(${(slot % S.n) * step}px, ${Math.floor(slot / S.n) * step}px)`;
  });
  if(!animate) requestAnimationFrame(() =>
    S.pieces.forEach(el => el.style.transition = ''));
}

/* 제자리에 남는 조각이 없도록 섞는다 */
function shuffleOrder(){
  const n2 = S.n * S.n;
  let arr;
  for(let t = 0; t < 40; t++){
    arr = [...Array(n2).keys()];
    for(let i = n2 - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    if(arr.every((p, s) => p !== s)) break;
  }
  S.order = arr;
}

async function runShatter(){
  show('shatter');
  setLine('감사합니다.', '');
  setActions([]);
  buildPieces();
  await wait(HOLD_MS);

  const bp = boardWrap.clientWidth;
  S.pieces.forEach(el => {
    const dx = (Math.random() - .5) * bp * .85;
    const dy = (Math.random() - .5) * bp * .85;
    el.style.transform += ` translate(${dx}px,${dy}px) rotate(${(Math.random()-.5)*70}deg)`;
    el.style.zIndex = Math.floor(Math.random() * 10);
  });
  if(navigator.vibrate) navigator.vibrate(30);
  await wait(SCATTER_MS);

  shuffleOrder();
  S.pieces.forEach(el => el.style.zIndex = '');
  layout(true);
  await wait(SETTLE_MS);

  setLine('얼굴이 흩어졌습니다.', '');
  setActions([
    ['직접 맞추기', '', startPlay],
    ['이미지 저장하기', 'ghost', () => exportImage('얼굴이 흩어졌습니다')]
  ]);
}

function startPlay(){
  show('play');
  S.sel = -1;
  setLine('조각을 옮겨 얼굴을 되찾으세요.', '두 조각을 차례로 누르면 자리가 바뀝니다.');
  setActions([
    ['다시 흩기', 'ghost', reshuffle],
    ['포기하기', 'ghost', giveUp]
  ]);
}

function onPieceTap(piece){
  if(S.scene !== 'play') return;
  const slot = S.order.indexOf(piece);
  if(S.sel === -1){
    S.sel = slot; S.pieces[piece].classList.add('sel'); return;
  }
  if(S.sel === slot){
    S.sel = -1; S.pieces[piece].classList.remove('sel'); return;
  }
  S.pieces[S.order[S.sel]].classList.remove('sel');
  [S.order[S.sel], S.order[slot]] = [S.order[slot], S.order[S.sel]];
  S.sel = -1;
  layout(true);
  if(S.order.every((p, s) => p === s)) setTimeout(finish, 460);
}

function reshuffle(){
  S.sel = -1;
  S.pieces.forEach(el => el.classList.remove('sel'));
  shuffleOrder(); layout(true);
  if(navigator.vibrate) navigator.vibrate(20);
}

/* 완성: 간격을 0으로 좁혀 한 장으로 되돌린 뒤 도장 */
async function finish(){
  show('done');
  S.pieces.forEach(el => el.classList.add('locked'));
  S.gap = 0; layout(true);
  if(navigator.vibrate) navigator.vibrate([25,60,90]);
  await wait(520);
  setLine('얼굴을 되찾았습니다.', '');
  stamp('본인 확인 완료');
  setActions([
    ['이미지 저장하기', 'stamp', () => exportImage('얼굴을 되찾았습니다')],
    ['다른 얼굴 망가뜨리기', 'ghost', restart]
  ]);
}

function giveUp(){
  show('done');
  S.sel = -1;
  S.pieces.forEach(el => el.classList.remove('sel'));
  const left = S.order.filter((p, s) => p !== s).length;
  setLine('이 얼굴은 이대로 살아갑니다.', `제자리를 못 찾은 조각 ${left}개`);
  stamp('복구 실패');
  setActions([
    ['이미지 저장하기', 'stamp', () => exportImage(`복구 실패 — 남은 조각 ${left}개`)],
    ['다른 얼굴 망가뜨리기', 'ghost', restart]
  ]);
}

function stamp(text){
  const el = $('stampMark');
  el.textContent = text;
  el.classList.remove('on');
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
}

function restart(){
  $('stampMark').classList.remove('on');
  S.gap = GAP_PX; S.srcBmp = null; S.viewCv = null; S.cropCv = null;
  S.sel = -1; S.rot = 0;
  board.innerHTML = '';
  $('fileCamera').value = ''; $('fileAlbum').value = '';
  show('intro');
}

/* ---------- 공유 이미지 ---------- */
function renderShareCanvas(caption){
  const size = CROP_SIZE_PX;
  const cv = document.createElement('canvas');
  cv.width = size; cv.height = size + SHARE_PAD_PX;
  const ctx = cv.getContext('2d');

  ctx.fillStyle = '#FCFCFB';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#2A3941';
  ctx.fillRect(0, 0, size, size);

  const gapS = Math.round(size * .006);
  const cell = (size - gapS * (S.n - 1)) / S.n;
  const src  = size / S.n;
  S.order.forEach((piece, slot) => {
    ctx.drawImage(S.cropCv,
      (piece % S.n) * src, Math.floor(piece / S.n) * src, src, src,
      (slot % S.n) * (cell + gapS), Math.floor(slot / S.n) * (cell + gapS), cell, cell);
  });

  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#16232B';
  ctx.font = '700 34px Pretendard, sans-serif';
  ctx.fillText(caption, 28, size + 46);
  ctx.fillStyle = '#5F7784';
  ctx.font = '400 24px Pretendard, sans-serif';
  ctx.fillText('내 얼굴 돌려줘', 28, size + 88);
  return cv;
}

async function exportImage(caption){
  const cv = renderShareCanvas(caption);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .9));
  const file = new File([blob], 'face.jpg', { type:'image/jpeg' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], text:'내 얼굴 돌려줘' }); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'face.jpg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 문의 ---------- */
function contactCount(){
  const key = 'contact-' + new Date().toISOString().slice(0,10);
  return { key, n: parseInt(localStorage.getItem(key) || '0', 10) };
}
$('btnContact').onclick = () => {
  $('contactNote').textContent = EMAILJS.publicKey ? '' : '전송 설정이 아직 연결되지 않았습니다.';
  $('modalContact').classList.add('on');
};
$('btnContactClose').onclick = () => $('modalContact').classList.remove('on');
$('btnContactSend').onclick = async () => {
  const text = $('contactText').value.trim();
  if(!text){ $('contactNote').textContent = '내용을 적어주세요.'; return; }
  if(!EMAILJS.publicKey){ $('contactNote').textContent = '전송 설정이 아직 연결되지 않았습니다.'; return; }
  const { key, n } = contactCount();
  if(n >= CONTACT_CAP){ $('contactNote').textContent = '오늘은 충분히 항의하셨습니다.'; return; }
  $('contactNote').textContent = '보내는 중...';
  try{
    await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        service_id: EMAILJS.serviceId,
        template_id: EMAILJS.templateId,
        user_id: EMAILJS.publicKey,
        template_params:{ message:text, app:APP_VERSION, ua:navigator.userAgent }
      })
    });
    localStorage.setItem(key, String(n + 1));
    $('contactNote').textContent = '전달했습니다.';
    $('contactText').value = '';
    setTimeout(() => $('modalContact').classList.remove('on'), 900);
  }catch(e){
    $('contactNote').textContent = '전송에 실패했습니다.';
  }
};

/* ---------- 배선 ---------- */
$('btnCamera').onclick = () => $('fileCamera').click();
$('btnAlbum').onclick  = () => $('fileAlbum').click();
$('fileCamera').onchange = e => loadFile(e.target.files[0]);
$('fileAlbum').onchange  = e => loadFile(e.target.files[0]);
$('btnRotL').onclick = () => { S.rot = (S.rot + 270) % 360; rebuildView(); };
$('btnRotR').onclick = () => { S.rot = (S.rot +  90) % 360; rebuildView(); };
$('btnCropBack').onclick = () => show('intro');
$('btnCropDone').onclick = () => { bakeCrop(); show('level'); };
document.querySelectorAll('.level').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.level').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    S.n = parseInt(b.dataset.n, 10);
  };
});
$('btnShatter').onclick = runShatter;
$('btnRestart').onclick = restart;

window.addEventListener('resize', () => {
  if(S.scene === 'crop' && S.viewCv) rebuildView();
  if(S.pieces.length) layout(false);
});

/* 설치형 PWA에서만 세로 잠금이 먹는다. 브라우저 탭은 rotateGate가 막는다. */
if(screen.orientation && screen.orientation.lock){
  screen.orientation.lock('portrait').catch(() => {});
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
